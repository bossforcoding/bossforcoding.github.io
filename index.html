  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f6f5f1;
      --card: #ffffff;
      --text: #1b1d21;
      --muted: #5f6570;
      --border: #e3e1da;
      --accent: #1f3a5f;
      --hover: #f0efe9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #121417;
        --card: #1a1d21;
        --text: #eceae4;
        --muted: #9aa0aa;
        --border: #2a2e34;
        --accent: #8fb3e0;
        --hover: #22262b;
      }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      line-height: 1.5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 56px 16px 40px;
    }
    main { width: 100%; max-width: 480px; }

    header { text-align: center; margin-bottom: 32px; }
    .avatar {
      width: 96px; height: 96px; border-radius: 50%;
      margin: 0 auto 16px;
      background: var(--accent); color: var(--bg);
      display: grid; place-items: center;
      font-family: "Source Serif 4", Georgia, serif; font-size: 36px;
      overflow: hidden;
    }
    .avatar img { width: 100%; height: 100%; object-fit: cover; }
    h1 {
      font-family: "Source Serif 4", Georgia, serif;
      font-weight: 600; font-size: 28px; letter-spacing: -0.01em;
    }
    .role { color: var(--muted); margin-top: 4px; }
    .bio { color: var(--muted); font-size: 15px; margin-top: 12px; }

    ul { list-style: none; padding: 0; display: grid; gap: 10px; }
    a.link {
      display: flex; align-items: center; gap: 14px;
      padding: 12px 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit; text-decoration: none;
      transition: background .15s, border-color .15s, transform .15s;
    }
    a.link:hover { background: var(--hover); border-color: var(--accent); transform: translateY(-1px); }
    a.link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .badge {
      flex: none; width: 36px; height: 36px; border-radius: 8px;
      display: grid; place-items: center;
      font-size: 13px; font-weight: 600; color: #fff;
    }
    .label { font-weight: 500; }
    .sub { display: block; color: var(--muted); font-size: 13px; }
    .arrow { margin-left: auto; color: var(--muted); }

    footer { text-align: center; color: var(--muted); font-size: 13px; margin-top: 36px; }
  </style>
</head>
<body>
  <main>
    <header>
